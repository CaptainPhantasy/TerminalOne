  const THEME_ORDER = ['tokyo-night','absolute-void','matrix','dracula','gruvbox','nord','catppuccin','solarized-dark','solarized-light','monokai','one-dark','github-dark'];
  const STYLES = { 'default': "'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace", 'floyd': "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, monospace" };

  const DEFAULT_THEME = 'tokyo-night';
  const DEFAULT_STYLE = 'default';
  const LS_THEME = 'terminalone.theme';
  const LS_STYLE = 'terminalone.style';
  const LS_SESSION = 'terminalone.sessionId';

  // ── State ───────────────────────────────────────────────────────────────
  let ws = null;
  let term = null;
  let fitAddon = null;
  let reconnectAttempts = 0;
  let reconnectTimer = null;
  let userInitiatedClose = false;
  let currentSessionId = null;
  let currentTheme = DEFAULT_THEME;
  let currentStyle = DEFAULT_STYLE;
  let rain = null; // lazily created digital-rain controller
  let fitTimer = null;
  let terminalResourceDisposers = [];

  // Module-level input sender. initTerminal() (which owns the dictation guard
  // and the real sendInput closure) sets this so key-bar buttons outside the
  // closure can emit control sequences.
  let sendInputFn = null;
  // Modifier toggle state for the on-screen key bar (Ctrl / Alt as sticky).
  let modState = { ctrl: false, alt: false };

  const $ = (sel) => document.querySelector(sel);

  function addTerminalResource(disposer) {
   if (!disposer) return;
   if (typeof disposer === 'function') {
    terminalResourceDisposers.push(disposer);
   } else if (typeof disposer.dispose === 'function') {
    terminalResourceDisposers.push(() => disposer.dispose());
   }
  }

  function cleanupTerminalResources() {
   if (fitTimer) {
    clearTimeout(fitTimer);
    fitTimer = null;
   }
   const disposers = terminalResourceDisposers.splice(0).reverse();
   for (const dispose of disposers) {
    try { dispose(); } catch (_) {}
   }
  }

  // ── Settings persistence ──────────────────────────────────────────────────
  function lsGet(key, fallback) {
   try { const v = localStorage.getItem(key); return v == null ? fallback : v; } catch (_) { return fallback; }
  }
  function lsSet(key, value) {
   try { localStorage.setItem(key, value); } catch (_) {}
  }
  function lsDel(key) {
   try { localStorage.removeItem(key); } catch (_) {}
  }

  // ── Device detection (iPhone vs iPad vs desktop) ──────────────────────────
  // iPadOS 13+ requests desktop sites and reports platform 'MacIntel' with a
  // touch screen, so the MacIntel+maxTouchPoints heuristic is required in
  // addition to the legacy /iPad/ UA string.
  function detectDevice() {
   const ua = navigator.userAgent || '';
   const isIPad = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
   const isIPhone = /iPhone|iPod/.test(ua);
   if (isIPad) return 'ipad';
   if (isIPhone) return 'iphone';
   return 'desktop';
  }

  // ── Digital rain (ported from VOID MatrixRain.tsx) ─────────────────────────
  function createRain(canvas) {
   return { start() { canvas.getContext('2d')?.clearRect(0, 0, canvas.width, canvas.height); }, stop() {} };
  }

  function setRainActive(active) {
   const canvas = $('#fxCanvas');
   if (active) {
    if (!rain) rain = createRain(canvas);
    rain.start();
   } else if (rain) {
    rain.stop();
   }
  }

  // ── Apply theme / style ────────────────────────────────────────────────────
  function applyTheme(id) {
   if (!THEMES[id]) id = DEFAULT_THEME;
   currentTheme = id;
   const t = THEMES[id];
   const root = document.documentElement.style;
   root.setProperty('--ui-bg', t.ui.bg);
   root.setProperty('--ui-fg', t.ui.fg);
   root.setProperty('--ui-elevated', t.ui.elevated);
   root.setProperty('--ui-border', t.ui.border);
   root.setProperty('--ui-accent', t.ui.accent);
   root.setProperty('--ui-muted', t.ui.muted);
   root.setProperty('--ui-on-accent', t.ui.bg);
   root.setProperty('--ui-danger', id === 'solarized-light' ? '#9c342c' : '#e2a69e');
   root.setProperty('--ui-warning', id === 'solarized-light' ? '#79561b' : '#dcc38b');
   document.querySelector('meta[name="theme-color"]')?.setAttribute('content', t.ui.bg);
   document.body.dataset.theme = id;
   if (term) term.options.theme = t.xterm;
   setRainActive(id === 'matrix');
   lsSet(LS_THEME, id);
  }

  function applyStyle(id) {
   if (!STYLES[id]) id = DEFAULT_STYLE;
   currentStyle = id;
   document.body.dataset.style = id;
   if (term) { term.options.fontFamily = STYLES[id]; scheduleFit(); }
   lsSet(LS_STYLE, id);
  }

  // ── UI feedback helpers ────────────────────────────────────────────────────
  function showBanner(msg, type = 'error') {
   const banner = $('#banner');
   banner.textContent = msg;
   banner.className = `banner ${type}`;
  }

  function hideBanner() {
   $('#banner').className = 'banner';
   $('#banner').style.display = 'none';
  }

  function updateStatus(text, state = 'neutral') {
   const status = $('#status');
   status.textContent = text;
   status.className = `terminal-status ${state}`;
   const dot = $('#statusDot');
   if (dot) dot.className = `status-dot ${state === 'connected' ? 'connected' : state === 'error' ? 'error' : state === 'neutral' ? '' : 'connecting'}`;
  }

  function setFooter(text) { $('#footerMeta').textContent = text; }
  function setSessionInfo(text) { $('#sessionInfo').textContent = text; }

  function scheduleFit(delay = 0) {
   if (fitTimer) clearTimeout(fitTimer);
   fitTimer = window.setTimeout(() => {
    fitTimer = null;
    if (!fitAddon || !term) return;
    try { fitAddon.fit(); } catch (_) {}
   }, delay);
  }

  // ── On-screen key bar ─────────────────────────────────────────────────────
  // xterm control sequences for the keys missing on iOS/iPadOS keyboards.
  const SEQ = {
   esc: '\x1b',
   tab: '\t',
   enter: '\r',
   del: '\x7f',
   ctrlB: '\x02',
   up: '\x1b[A', down: '\x1b[B', right: '\x1b[C', left: '\x1b[D',
   home: '\x1b[H', end: '\x1b[F', pgup: '\x1b[5~', pgdn: '\x1b[6~'
  };

  function emitSeq(seq) {
   if (!sendInputFn) return;
   sendInputFn(seq);
   // Sticky modifiers consume themselves on the next emit.
   modState.ctrl = false;
   modState.alt = false;
   syncModButtons();
  }

  /** Map a literal character to its Ctrl / Alt combination if a mod is sticky. */
  function emitLiteral(ch) {
   if (!sendInputFn) return;
   let out = ch;
   if (modState.ctrl && ch.length === 1) {
    // Ctrl+X = X & 0x1f (ASCII control code).
    out = String.fromCharCode(ch.charCodeAt(0) & 0x1f);
   }
   if (modState.alt && out.length === 1) {
    // Alt prefix in xterm: ESC then the char.
    out = '\x1b' + out;
   }
   sendInputFn(out);
   modState.ctrl = false;
   modState.alt = false;
   syncModButtons();
  }

  function syncModButtons() {
   document.querySelectorAll('.kb-key.toggle[data-mod]').forEach((b) => {
    b.classList.toggle('active', !!modState[b.dataset.mod]);
   });
  }

  /** Build a key element. kind: 'seq' | 'literal' | 'toggle' | 'special'. */
  function makeKey(label, opts = {}) {
   const el = document.createElement('button');
   el.type = 'button';
   el.className = 'kb-key';
   el.textContent = label;
   if (opts.title) el.title = opts.title;
   if (opts.kind === 'toggle') {
    el.classList.add('toggle');
    if (opts.mod) el.dataset.mod = opts.mod;
    el.addEventListener('click', () => {
     const m = opts.mod;
     if (!m) return;
     // Toggling one mod clears the other (single sticky mod at a time).
     modState[m] = !modState[m];
     Object.keys(modState).forEach((k) => { if (k !== m) modState[k] = false; });
     syncModButtons();
    });
   } else if (opts.kind === 'special' && opts.special === 'del') {
    el.addEventListener('click', () => emitSeq(SEQ.del));
   } else if (opts.seq) {
    el.addEventListener('click', () => emitSeq(opts.seq));
   } else if (opts.literal != null) {
    el.addEventListener('click', () => emitLiteral(opts.literal));
   }
   return el;
  }

  function makeArrowPad() {
   const wrap = document.createElement('div');
   wrap.className = 'kb-arrows';
   const top = document.createElement('div'); top.className = 'kb-row';
   top.appendChild(makeKey('↑', { seq: SEQ.up, title: 'Up' }));
   const mid = document.createElement('div'); mid.className = 'kb-row';
   mid.appendChild(makeKey('←', { seq: SEQ.left, title: 'Left' }));
   mid.appendChild(makeKey('↓', { seq: SEQ.down, title: 'Down' }));
   mid.appendChild(makeKey('→', { seq: SEQ.right, title: 'Right' }));
   wrap.appendChild(top);
   wrap.appendChild(mid);
   return wrap;
  }

  function makeGroup(children) {
   const g = document.createElement('div');
   g.className = 'kb-group';
   children.forEach((c) => g.appendChild(c));
   return g;
  }

  function buildKeyBars() {
   const device = detectDevice();
   document.body.dataset.device = device;
   const iphone = $('#keybarIphone');
   const ipad = $('#keybarIpad');

   // iPhone: compact single row — essentials only.
   iphone.innerHTML = '';
   if (device === 'iphone') {
    iphone.appendChild(makeGroup([
     makeKey('ESC', { seq: SEQ.esc, title: 'Escape' }),
     makeKey('TAB', { seq: SEQ.tab, title: 'Tab' }),
     makeKey('ENTER', { seq: SEQ.enter, title: 'Enter' }),
     makeKey('Ctrl+b', { seq: SEQ.ctrlB, title: 'Send Ctrl+b to herdr' }),
     makeKey('CTRL', { kind: 'toggle', mod: 'ctrl', title: 'Ctrl (sticky)' })
    ]));
    iphone.appendChild(makeGroup([
     makeKey('←', { seq: SEQ.left }),
     makeKey('↓', { seq: SEQ.down }),
     makeKey('↑', { seq: SEQ.up }),
     makeKey('→', { seq: SEQ.right })
    ]));
    iphone.appendChild(makeGroup([
     makeKey('~', { literal: '~' }),
     makeKey('/', { literal: '/' }),
     makeKey('|', { literal: '|' }),
     makeKey('-', { literal: '-' })
    ]));
   }

   // iPad: wide — modifiers + navigation + arrow pad + symbols + DEL.
   ipad.innerHTML = '';
   if (device === 'ipad') {
    ipad.appendChild(makeGroup([
     makeKey('ESC', { seq: SEQ.esc, title: 'Escape' }),
     makeKey('TAB', { seq: SEQ.tab, title: 'Tab' }),
     makeKey('ENTER', { seq: SEQ.enter, title: 'Enter' }),
     makeKey('Ctrl+b', { seq: SEQ.ctrlB, title: 'Send Ctrl+b to herdr' }),
     makeKey('CTRL', { kind: 'toggle', mod: 'ctrl', title: 'Ctrl (sticky)' }),
     makeKey('ALT', { kind: 'toggle', mod: 'alt', title: 'Alt / Meta (sticky)' })
    ]));
    ipad.appendChild(makeGroup([
     makeKey('HOME', { seq: SEQ.home }),
     makeKey('END', { seq: SEQ.end }),
     makeKey('PGUP', { seq: SEQ.pgup }),
     makeKey('PGDN', { seq: SEQ.pgdn })
    ]));
    ipad.appendChild(makeGroup([ makeArrowPad() ]));
    ipad.appendChild(makeGroup([
     makeKey('~', { literal: '~' }),
     makeKey('/', { literal: '/' }),
     makeKey('|', { literal: '|' }),
     makeKey('-', { literal: '-' }),
     makeKey('DEL', { kind: 'special', special: 'del', title: 'Delete' })
    ]));
   }
  }

  // ── Two-finger touch scroll (native iOS feel with momentum) ────────────────
  // One-finger touches pass through to xterm (text selection etc.). Two fingers
  // scroll the scrollback with inertial momentum on release, like a native iOS
  // scroll view.
  function initTouchScroll() {
   if (!term) return;
   const screen = term.element;
   if (!screen) return;
   let scrolling = false;
   let lastY = 0;
   let velocity = 0;
   let lastMoveTs = 0;
   let momentumRaf = 0;
   let lineHeight = 0;

   function getLineHeight() {
    if (lineHeight > 0) return lineHeight;
    const rows = screen.querySelector('.xterm-rows');
    if (rows) {
     const lh = parseFloat(getComputedStyle(rows).lineHeight) || 0;
     if (lh > 0) { lineHeight = lh; return lineHeight; }
    }
    // Fallback: derive from terminal font size + line height setting.
    lineHeight = (term.options.fontSize || 14) * (term.options.lineHeight || 1.2);
    return lineHeight;
   }

   function avgY(touches) {
    let sum = 0;
    for (let i = 0; i < touches.length; i += 1) sum += touches[i].clientY;
    return sum / touches.length;
   }

   function stopMomentum() {
    if (momentumRaf) { cancelAnimationFrame(momentumRaf); momentumRaf = 0; }
   }

   function momentumStep() {
    if (Math.abs(velocity) < 0.5) { momentumRaf = 0; return; }
    const lh = getLineHeight();
    const lines = Math.round(velocity / lh);
    if (lines !== 0 && term) term.scrollLines(lines);
    velocity *= 0.92; // decay
    momentumRaf = requestAnimationFrame(momentumStep);
   }

   const onTouchStart = (e) => {
    if (e.touches.length !== 2) return;
    scrolling = true;
    stopMomentum();
    lastY = avgY(e.touches);
    velocity = 0;
    lastMoveTs = Date.now();
   };

   const onTouchMove = (e) => {
    if (!scrolling) return;
    e.preventDefault();
    const cur = avgY(e.touches);
    const dy = lastY - cur; // up-drag (cur smaller) → scroll back (positive)
    const lh = getLineHeight();
    const lines = Math.round(dy / lh);
    if (lines !== 0 && term) term.scrollLines(lines);
    const now = Date.now();
    const dt = Math.max(1, now - lastMoveTs);
    velocity = dy / dt * 16; // px per ~frame
    lastY = cur;
    lastMoveTs = now;
   };

   const endScroll = (e) => {
    if (!scrolling) return;
    if (e.touches && e.touches.length >= 2) return; // still two fingers down
    scrolling = false;
    momentumRaf = requestAnimationFrame(momentumStep);
   };
   screen.addEventListener('touchstart', onTouchStart, { passive: true });
   screen.addEventListener('touchmove', onTouchMove, { passive: false });
   screen.addEventListener('touchend', endScroll, { passive: true });
   screen.addEventListener('touchcancel', endScroll, { passive: true });
   return () => {
    stopMomentum();
    screen.removeEventListener('touchstart', onTouchStart);
    screen.removeEventListener('touchmove', onTouchMove);
    screen.removeEventListener('touchend', endScroll);
    screen.removeEventListener('touchcancel', endScroll);
   };
  }

  // ── Terminal ────────────────────────────────────────────────────────────────
  function initTerminal() {
   cleanupTerminalResources();
   if (term) {
    try { term.dispose(); } catch (_) {}
   }

   term = new Terminal({
    cursorBlink: true,
    cursorStyle: 'block',
    fontSize: 14,
    lineHeight: 1.2,
    fontFamily: STYLES[currentStyle],
    theme: THEMES[currentTheme].xterm,
    allowTransparency: true,
    minimumContrastRatio: 4.5,
    allowProposedApi: true,
    scrollback: 10000,
    convertEol: false
   });

   fitAddon = new FitAddon();
   term.loadAddon(fitAddon);
   term.loadAddon(new WebLinksAddon());
   term.open($('#terminal'));
   requestAnimationFrame(() => fitAddon.fit());


   addTerminalResource(initTouchScroll());

 // ── iOS dictation / typing guard ────────────────────────────────────────
 // Replaced buggy inline debounce (which overwrote fast keystrokes) with
 // InputGuard: single chars send immediately, duplicated onData events are
 // dropped, and iOS/IME cumulative partials send only the new suffix.

  function sendInput(data) {
   if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'input', data }));
   }
  }
  const guard = new InputGuard({ send: sendInput, identicalDedupeMs: 500 });
  // Expose the sender to the on-screen key bar (outside this closure).
  sendInputFn = (data) => guard.send(data);

  addTerminalResource(bindInputGuard(term, guard));

   // Take focus on load where there is no touchscreen, so the very first
   // keypress reaches the terminal. A tablet would get its on-screen keyboard
   // opened uninvited, so those devices rely on the key-capture fallback above.
   // (Headless Chrome reports a coarse pointer, so maxTouchPoints is the
   // reliable signal here.)
   if (!navigator.maxTouchPoints) {
     requestAnimationFrame(() => { try { term.focus(); } catch (_) {} });
   }

   // A key typed while <body> has focus never reaches xterm, so the first press
   // was silently discarded and the user had to press it again. Capture the
   // first printable key at document level, focus the terminal, and deliver it.
   // Focusing only happens when the user actually types, so a touch device does
   // not have its on-screen keyboard opened for it.
   document.addEventListener('keydown', (event) => {
     const el = document.activeElement;
     if (el && el !== document.body) return;
     if (event.metaKey || event.ctrlKey || event.altKey) return;
     if (!event.key || event.key.length !== 1) return;
     try { term.focus(); } catch (_) {}
     sendInput(event.key);
     event.preventDefault();
   }, true);

   addTerminalResource(term.onResize(({ cols, rows }) => {
    if (ws && ws.readyState === WebSocket.OPEN) {
     ws.send(JSON.stringify({ type: 'resize', cols, rows }));
    }
   }));

   const ro = new ResizeObserver(() => scheduleFit());
   ro.observe($('#terminal'));
   addTerminalResource(() => ro.disconnect());
  }

  function handleServerMessage(msg) {
   switch (msg.type) {
    case 'ready': {
     currentSessionId = msg.sessionId;
     lsSet(LS_SESSION, msg.sessionId);
     if (msg.resumed) {
      // Buffer replay lands in the fresh terminal from connect(); don't reset.
      updateStatus('Resumed', 'connected');
      setFooter(`Resumed · ${msg.cwd}`);
     } else {
      updateStatus('Connected', 'connected');
      setFooter(`${msg.command} · ${msg.cwd}`);
     }
     setSessionInfo(`session ${msg.sessionId.slice(0, 8)}`);
     break;
    }
    case 'output': {
     term?.write(msg.data);
     break;
    }
    case 'exit': {
     updateStatus(`Exited (code ${msg.code})`, 'error');
     setFooter(`Process exited · code ${msg.code}`);
     break;
    }
    case 'shell-reset': {
     // Wiping here erased a failing shell's own error message and made a
     // respawn storm look like a frozen terminal. Keep what the user saw.
     term?.write('\r\n\x1b[2m──── shell restarted ────\x1b[0m\r\n');
     updateStatus('Connected', 'connected');
     setFooter('Fresh shell — type to continue');
     break;
    }
    case 'resume-failed': {
     // Target session gone/expired — fall back to a fresh shell on this open ws.
     infoResumeFail(msg);
     lsDel(LS_SESSION);
     currentSessionId = null;
     if (ws && ws.readyState === WebSocket.OPEN) {
      const dims = fitAddon?.proposeDimensions() || { cols: 120, rows: 40 };
      ws.send(JSON.stringify({ type: 'shell', cols: dims.cols, rows: dims.rows }));
     }
     break;
    }
    case 'voice-ready': {
     window.dispatchEvent(new CustomEvent('t1:voice-ready', { detail: msg }));
     break;
    }
    case 'voice-transcript': {
     window.dispatchEvent(new CustomEvent('t1:voice-transcript', { detail: msg }));
     break;
    }
    case 'voice-error': {
     window.dispatchEvent(new CustomEvent('t1:voice-error', { detail: msg }));
     break;
    }
    case 'error': {
     const errText = `\r\n\x1b[31m[ERROR ${msg.code}]\x1b[0m ${msg.message}\r\n`;
     term?.write(errText);
     showBanner(`[${msg.code}] ${msg.message}`, 'error');
     updateStatus(msg.code, 'error');
     break;
    }
   }
  }

  function infoResumeFail(msg) {
   term?.write(`\r\n\x1b[33m[resume unavailable — starting fresh shell]\x1b[0m\r\n`);
  }

  function connect() {
   if (ws && ws.readyState === WebSocket.OPEN) return;

   if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
   }

   userInitiatedClose = false;

   if (ws) {
    try { ws.close(); } catch (_) {}
   }

   initTerminal();
   updateStatus('Connecting…', 'connecting');
   hideBanner();

   const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
   ws = new WebSocket(`${protocol}//${location.host}`);

   ws.onopen = () => {
    reconnectAttempts = 0;
    const dims = fitAddon?.proposeDimensions() || { cols: 120, rows: 40 };
    // If we have a saved session id, try to resume it; otherwise spawn fresh.
    const savedId = lsGet(LS_SESSION, null);
    if (savedId) {
     ws.send(JSON.stringify({ type: 'resume', sessionId: savedId, cols: dims.cols, rows: dims.rows }));
    } else {
     ws.send(JSON.stringify({ type: 'shell', cols: dims.cols, rows: dims.rows }));
    }
    scheduleFit();
   };

   ws.onmessage = (evt) => {
    try { handleServerMessage(JSON.parse(evt.data)); }
    catch (e) { showBanner('Malformed server message', 'error'); }
   };

   ws.onerror = () => {
    showBanner('WebSocket connection failed', 'error');
    updateStatus('WS error', 'error');
   };

   ws.onclose = () => {
    if (userInitiatedClose) return;
    updateStatus('Disconnected', 'error');
    // Leave the saved session id in place so the reconnect attempts a resume.
    const delay = Math.min(1_000 * Math.pow(2, reconnectAttempts), 60_000);
    reconnectAttempts++;
    reconnectTimer = setTimeout(() => {
     if (!userInitiatedClose) connect();
    }, delay);
   };
  }

  function closeConnection() {
   userInitiatedClose = true;
   reconnectAttempts = 0;

   // Explicit close must never resume: clear the saved session id first.
   lsDel(LS_SESSION);
   currentSessionId = null;

   if (reconnectTimer) {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
   }

   if (ws) {
    try { ws.send(JSON.stringify({ type: 'close' })); } catch (_) {}
    ws.close();
    ws = null;
   }

   try { term?.dispose(); } catch (_) {}
   cleanupTerminalResources();
   term = null;
   fitAddon = null;
   sendInputFn = null;

   updateStatus('Closed', 'neutral');
   setFooter('Connection closed');
   setSessionInfo('');
  }

  // ── Settings UI ─────────────────────────────────────────────────────────────
  function buildThemeOptions() {
   const sel = $('#themeSelect');
   sel.innerHTML = '';
   for (const id of THEME_ORDER) {
    if (!THEMES[id]) continue;
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = THEMES[id].name;
    sel.appendChild(opt);
   }
  }

  function setVoiceStatus(text, kind) {
   const el = $('#voiceStatus');
   if (!el) return;
   el.textContent = text || '';
   el.dataset.kind = kind || '';
  }

  function fillVoiceFields(data) {
   $('#voiceCommand').value = data.command || '';
   $('#voiceModel').value = data.model || '';
   $('#voiceLanguage').value = data.language || '';
   $('#voiceArgs').value = data.args || '';
  }

  async function loadVoiceSettings() {
   setVoiceStatus('Loading voice settings...');
   try {
    const res = await fetch('/api/voice/settings', { cache: 'no-store' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    fillVoiceFields(data);
    const resolved = data.resolved || {};
    if (resolved.commandFound) setVoiceStatus(`Command found: ${resolved.commandPath}`, 'ok');
    else setVoiceStatus(`Command not found: ${data.command || '(empty)'}`, 'error');
   } catch (err) {
    setVoiceStatus(`Could not load voice settings: ${err.message || err}`, 'error');
   }
  }

  async function saveVoiceSettings() {
   const button = $('#voiceSave');
   const body = {
    command: $('#voiceCommand').value,
    model: $('#voiceModel').value,
    language: $('#voiceLanguage').value,
    args: $('#voiceArgs').value
   };
   button.disabled = true;
   setVoiceStatus('Saving voice settings...');
   try {
    const res = await fetch('/api/voice/settings', {
     method: 'PUT',
     headers: { 'Content-Type': 'application/json' },
     body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    fillVoiceFields(data);
    const resolved = data.resolved || {};
    if (resolved.commandFound) setVoiceStatus(`Saved. Command found: ${resolved.commandPath}`, 'ok');
    else setVoiceStatus(`Saved, but command not found: ${data.command || '(empty)'}`, 'warn');
   } catch (err) {
    setVoiceStatus(`Could not save voice settings: ${err.message || err}`, 'error');
   } finally {
    button.disabled = false;
   }
  }

  function openSettings() {
   $('#styleSelect').value = currentStyle;
   $('#themeSelect').value = currentTheme;
   loadVoiceSettings();
   $('.app-shell').inert = true;
   $('#settingsModal').classList.add('open');
   $('#styleSelect').focus();
  }
  function closeSettings() { $('.app-shell').inert = false; $('#settingsModal').classList.remove('open'); $('#settingsBtn').focus(); }

  // ── Wire up ──────────────────────────────────────────────────────────────────
  buildThemeOptions();
  buildKeyBars();
  applyStyle(lsGet(LS_STYLE, DEFAULT_STYLE));
  applyTheme(lsGet(LS_THEME, DEFAULT_THEME));

  $('#settingsModal').addEventListener('keydown', e => {
   if (e.key === 'Escape') { e.preventDefault(); closeSettings(); }
   if (e.key !== 'Tab') return;
   const items = [...$('#settingsModal').querySelectorAll('button, select, input, textarea')].filter(el => !el.disabled);
   const first = items[0], last = items[items.length - 1];
   if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
   else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#settingsClose').addEventListener('click', closeSettings);
  $('#settingsModal').addEventListener('click', (e) => { if (e.target === $('#settingsModal')) closeSettings(); });
  $('#styleSelect').addEventListener('change', (e) => applyStyle(e.target.value));
  $('#themeSelect').addEventListener('change', (e) => applyTheme(e.target.value));
  $('#voiceSave').addEventListener('click', saveVoiceSettings);

  $('#reconnectBtn').addEventListener('click', () => {
   // Manual reconnect keeps the saved session id so it resumes.
   userInitiatedClose = false;
   connect();
  });
  $('#closeBtn').addEventListener('click', closeConnection);

  // Re-detect on orientation change (iPhone↔iPad-like layout shifts are rare,
  // but viewport reflow should refresh the key bars).
  window.addEventListener('orientationchange', () => {
   setTimeout(() => { buildKeyBars(); scheduleFit(); }, 200);
  });

  // ── Feature module loader ────────────────────────────────────────────────
  // public/features/*.mjs each export init(T1). This builds the T1 facade the
  // feature API contract expects, then dynamically imports every module and
  // runs its init() inside try/catch so one failure cannot break the app.
  const termReadyCbs = [];
  function runTermReadyCallback(cb) {
    if (!term) return;
    try { addTerminalResource(cb(term)); } catch (_) {}
  }
  function onTermReady(cb) {
    termReadyCbs.push(cb);
    runTermReadyCallback(cb);
  }
  // Re-fire onTermReady callbacks whenever the terminal is recreated on
  // reconnect. initTerminal() already ran before this loader exists, so fire
  // for the current term now.
  function __fireTermReady() { if (term) termReadyCbs.forEach(runTermReadyCallback); }
  const __origInitTerminal = initTerminal;
  initTerminal = function () { __origInitTerminal(); __fireTermReady(); };
  __fireTermReady();

  // ── Toast notification system ─────────────────────────────────────────────
  // A real transient toast (auto-dismiss) layered above the app. Features call
  // T1.toast(msg, type) expecting a notification, NOT a persistent status-bar
  // change. Multiple toasts stack and fade; the toast-status feature wraps
  // this to also log them.
  let __toastSeq = 0;
  function __toastContainer() {
    let c = document.getElementById('t1toastHost');
    if (!c) {
      c = document.createElement('div');
      c.id = 't1toastHost';
      c.className = 't1toast-host';
      document.querySelector('.terminal-container').appendChild(c);
    }
    return c;
  }
  function __showToast(msg, type) {
    const el = document.createElement('div');
    el.className = `t1toast t1toast-${type || 'info'}`;
    el.setAttribute('role', 'status');
    el.textContent = String(msg).slice(0, 160);
    __toastContainer().appendChild(el);
    const id = ++__toastSeq;
    el.dataset.seq = String(id);
    // Animate in, hold, then fade out and remove.
    requestAnimationFrame(() => el.classList.add('show'));
    const ttl = type === 'error' ? 6000 : type === 'warn' ? 4500 : 3000;
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 350);
    }, ttl);
    return id;
  }

  // A failed or missing local STT command is usually a settings problem; point
  // the user at the new section instead of only surfacing the raw error code.
  window.addEventListener('t1:voice-error', (event) => {
   const code = event.detail && event.detail.code;
   if (code === 'STT_UNAVAILABLE' || code === 'STT_FAILED') {
    __showToast('Voice settings: Settings → Voice', 'warn');
   }
  });

  const T1 = {
    get term() { return term; },
    get ws() { return ws; },
    // detectDevice() is defined above; surface the current device so features
    // can gate per-device (desktop-palette, haptic-keys, split-view, etc.).
    get device() { return document.body.dataset.device || detectDevice(); },
    sendData: (data) => { if (sendInputFn) sendInputFn(data); },
    fit: () => scheduleFit(),
    toast: (msg, type = 'info') => __showToast(msg, type),
    onTermReady,
    storage: {
      get: (k, def) => { const v = lsGet(k, undefined); return v === undefined ? def : v; },
      set: (k, v) => lsSet(k, String(v)),
      del: (k) => lsDel(k)
    },
    ui: {
      toolbar: () => document.getElementById('t1toolbar'),
      appShell: () => document.querySelector('.app-shell'),
      settingsPanel: () => document.querySelector('#settingsModal .settings-panel'),
      addStyle: (css) => {
        const s = document.createElement('style');
        s.textContent = css;
        document.head.appendChild(s);
      },
      makeButton: (label, title, onClick) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 't1button';
        b.textContent = label;
        if (title) b.title = title;
        if (typeof onClick === 'function') b.addEventListener('click', onClick);
        return b;
      }
    }
  };

  // Ordered by the ShellFish parity manifest, then the extra verticals.
  const FEATURE_MODULES = [
    'theme-system', 'keyboard-shortcuts', 'history-undo', 'autosave',
    'recent-commands', 'search', 'command-palette', 'toast-status',
    'osc-bridge', 'links', 'zoom', 'keybar-config', 'voice-input', 'session-manager',
    'status-metrics', 'export', 'clipboard', 'snippets', 'fontsize',
    'wake-fullscreen', 'desktop-palette', 'file-drop', 'floating-palette',
    'haptic-keys', 'keepalive', 'multi-window-sync', 'phone-landscape-focus',
    'session-lock', 'settings-sync', 'shortcut-help', 'smart-completions',
    'smart-suggest', 'split-view', 'stylus-support', 'swipe-history',
    'swipe-sessions', 'tab-reorder', 'two-finger-menu', 'window-title'
  ];
  (async () => {
    const loaded = [];
    for (const name of FEATURE_MODULES) {
      try {
        const mod = await import(`./features/${name}.mjs`);
        if (typeof mod.init === 'function') { mod.init(T1); loaded.push(name); }
      } catch (err) {
        console.error(`[features] ${name} failed to load:`, err);
      }
    }
    window.__t1Features = loaded;
  })();

  connect();

  // Best-effort: on touch devices only, shed the browser URL bar by entering
  // fullscreen on the first user gesture. Gated to iPhone/iPad so a desktop
  // click is never hijacked into fullscreen. iPhone Safari has no element
  // Fullscreen API (the requestFullscreen guard no-ops there); the real
  // chrome-hiding path on iPhone is PWA standalone (Add to Home Screen).
  (function attemptFullscreenOnce() {
   const dev = detectDevice();
   if (dev !== 'iphone' && dev !== 'ipad') return;
   const standalone =
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true;
   if (standalone) return;
   const target = document.documentElement;
   if (!target || !target.requestFullscreen) return;
   function go() {
    document.removeEventListener('pointerdown', go);
    document.removeEventListener('keydown', go);
    if (!document.fullscreenElement) target.requestFullscreen().catch(() => {});
   }
   document.addEventListener('pointerdown', go, { passive: true });
   document.addEventListener('keydown', go);
  })();

  // Expose for automated tests.
  window.__terminalOne = {
   get theme() { return currentTheme; },
   get style() { return currentStyle; },
   get device() { return document.body.dataset.device; },
   themes: () => THEME_ORDER.slice(),
   setTheme: applyTheme,
   setStyle: applyStyle,
   termTheme: () => term && term.options.theme,
   // Test hooks for the key bar + resume.
   detectDevice,
   visibleKeyBar: () => {
    const d = document.body.dataset.device;
    if (d === 'iphone') return $('#keybarIphone');
    if (d === 'ipad') return $('#keybarIpad');
    return null;
   },
   keyCount: () => {
    const bar = (document.body.dataset.device === 'iphone' ? $('#keybarIphone') : $('#keybarIpad'));
    return bar ? bar.querySelectorAll('.kb-key').length : 0;
   },
   savedSession: () => lsGet(LS_SESSION, null)
  };
 </script>
 <script>
  /* PWA: register the offline shell service worker. Guarded — failure never breaks the app. */
  if ('serviceWorker' in navigator) {
   window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch((e) => {
     console.warn('TerminalOne SW registration failed:', e);
    });
   });
  }
 </script>
</body>
</html>
